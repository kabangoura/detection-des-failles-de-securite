# Publie une nouvelle version de KMB Library sur PyPI, sans aucune clé à copier (« éditeur de confiance » PyPI).
# Déclenchement : publication d'une « release » GitHub nommée vX.Y.Z (ex. v2.2.0).
# Ordre : tests sur Windows, Linux, macOS → construction du paquet → vérifications → envoi sur PyPI.
# Si une étape échoue, rien n'est publié.
name: Publication sur PyPI

on:
  release:
    types: [published]
  workflow_dispatch:   # construction et vérification seulement (sans envoi), pour essayer

jobs:
  tests:
    uses: ./.github/workflows/kmb-multiplateforme.yml

  construire:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Construction du paquet
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Version du paquet = nom de la release
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}" || { echo "pyproject.toml dit $version, la release s'appelle ${{ github.event.release.tag_name }}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: paquet
          path: dist/

  publier:
    if: github.event_name == 'release'
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kmb-library/
    permissions:
      id-token: write   # preuve d'identité GitHub → PyPI (remplace la clé pypi-…)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paquet
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
