# Publie le dossier web/ sur GitHub Pages (https://kabangoura.github.io/detection-des-failles-de-securite/)
# à chaque modification du site. Le reste du dépôt (code, tests) n'est pas publié comme site.
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploiement
        uses: actions/deploy-pages@v4
